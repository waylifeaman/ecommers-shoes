<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RegisterPage</title>
</head>
<body>
    <div class="card-auth">
        <h1 class="judul" id="judul">Silahkan Daftar Terlebih Dahulu</h1>

        <div class="form">
            <p>Masukkan Nama Lengkap</p>
            <input type="text" name="" id="name" placeholder="Masukkan Nama" required><br>
            <p>Masukkan Email</p>
            <input type="email" name="" id="email" placeholder="Masukkan Email" required><br>
            <p>Masukkan Password</p>
            <input type="password" name="" id="password" placeholder="Masukkan password" required><br>
        </div>
        <div class="submit">
            <button id="btn-register">Simpan</button>
            <p>Sudah punya akun ? <a href="login.html">Login</a></p>
        </div>

    </div>
    <script src="../js/auth/script.js"></script>
</body>
</html>
