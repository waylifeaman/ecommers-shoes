<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoginPage</title>
</head>

<body>
    <div class="card-auth">
        <h1 class="judul" id="judul">Silahkan Login Terlebih Dahulu</h1>

        <div class="form">
            <p>Masukkan Email</p>
            <input type="email" name="" id="email" placeholder="Masukkan Email" required><br>
            <p>Masukkan Password</p>
            <input type="password" name="" id="password" placeholder="Masukkan password" required><br>
        </div>
        <div class="submit">
            <button id="btn-login">Login</button>
            <p>Belum punya akun ? <a href="register.html">Daftar</a></p>
        </div>

    </div>
    <script src="../js/auth/script.js"></script>
</body>

</html>
